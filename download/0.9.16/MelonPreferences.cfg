# Second Crucible（第二试炼 / Crucible Unlock）0.9.16 — MelonLoader 配置
#
# 用法：把这个文件放到 <游戏安装目录>\UserData\MelonPreferences.cfg
# 如果该文件已经存在（装过别的 Mod 或启动过游戏），不要覆盖它：其他 Mod
# 的设置也在同一个文件里，只把下面 [CrucibleUnlock] 整段合并进去。
#
# Usage: put this file at <game directory>\UserData\MelonPreferences.cfg
# If it already exists, do not overwrite it: other mods keep their settings
# in the same file. Merge the [CrucibleUnlock] section below into it instead.
#
# 本节内容与 MelonLoader 0.7.3 为 0.9.16 实际生成的配置一致，只少了
# motion_trace_directory：那一项记录的是生成时那台机器的绝对路径，首次
# 启动时 MelonLoader 会按你自己的安装位置自动补上。
# This mirrors what MelonLoader 0.7.3 generates for 0.9.16, except for
# motion_trace_directory, which holds a machine-specific absolute path and is
# created automatically on first launch.

[CrucibleUnlock]
# probe = 只探测；runtime-unlock = 临时解锁第二试炼（不写完成状态）；旧持久模式停用
mode = "runtime-unlock"
# 仅在已确认的隐藏 Warrick 对象身份与坏子引用结构相符时跳过音乐时间轴；不处理献祭动画
guard_broken_warrick_music = true
# 每次二阶段动作执行时，将本实体已确认错误的远方落点改为当刻位置；覆盖重复出生，不改共享资产或存档
repair_warrick_phase2_target = true
# 开层时调用原生SetFloor，沿用原生清场、提示、交互与转场
repair_bossrush_progression = true
# 只在献祭轨绑定缺失或错误时临时指向当前献祭角色，结束恢复
repair_ritual_animator = true
# 主线程轮询隐藏首 Warrick 的显示位置、模型偏移与动作，不添加位置同步钩子，后台写入独立 JSONL
trace_boss_motion = false
# 每个 Boss 原生痕迹掉落基数，0关闭，允许0至1000；多人修正沿用原生规则；重启生效
boss_trace_drop_amount = 300

# Crossbow animation class / 弩枪动画类别，保留默认 30
bowgun_weapon_class = 30
